<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>pay calculator</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #fafafa;
        margin: 0;
        padding: 40px;
        color: #333;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 600;
        color: #444;
    }

    .grid {
        max-width: 700px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    /* 📱 Mobile-friendly stacking */
    @media (max-width: 600px) {
        .grid {
            grid-template-columns: 1fr;
        }
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .card-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 10px;
        color: #555;
    }

    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    input {
        width: 90px;
        padding: 6px;
        font-size: 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
    }

    #total {
        margin-top: 40px;
        text-align: center;
        font-size: 26px;
        font-weight: 700;
        color: #222;
    }
</style>
</head>
<body>

<h1>pay calculator</h1>

<div class="grid">

    <div class="card">
        <div class="card-title">normal</div>

        <div class="row"><span>base</span><input type="number" data-key="base"></div>
        <div class="row"><span>saturday/OT</span><input type="number" data-key="sat"></div>
        <div class="row"><span>sunday</span><input type="number" data-key="sun"></div>
        <div class="row"><span>sunday OT</span><input type="number" data-key="sun_ot"></div>
        <div class="row"><span>public holiday</span><input type="number" data-key="ph"></div>
    </div>

    <div class="card">
        <div class="card-title">supervisor</div>

        <div class="row"><span>base</span><input type="number" data-key="s_base"></div>
        <div class="row"><span>saturday/OT</span><input type="number" data-key="s_sat"></div>
        <div class="row"><span>sunday</span><input type="number" data-key="s_sun"></div>
        <div class="row"><span>sunday OT</span><input type="number" data-key="s_sun_ot"></div>
        <div class="row"><span>public holiday</span><input type="number" data-key="s_ph"></div>
    </div>

</div>

<div id="total">$0.00</div>

<script>
    const rates = {
        base: 28.6,
        sat: 34.32,
        sun: 40.04,
        sun_ot: 51.48,
        ph: 57.2,

        s_base: 30.29,
        s_sat: 36.34,
        s_sun: 42.4,
        s_sun_ot: 54.52,
        s_ph: 60.57
    };

    function calculateTotal() {
        let total = 0;
        document.querySelectorAll("input").forEach(input => {
            const hours = parseFloat(input.value) || 0;
            const key = input.dataset.key;
            total += hours * rates[key];
        });

        document.getElementById("total").textContent =
            `$${total.toFixed(2)}`;
    }

    document.querySelectorAll("input").forEach(input => {
        input.addEventListener("input", calculateTotal);
    });
</script>

</body>
</html>
