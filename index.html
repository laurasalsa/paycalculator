<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Pay Calculator</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #2ecc71;
            --primary-hover: #27ae60;
            --disabled-bg: #e0e0e0;
            --disabled-text: #7f8c8d;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Mode Button Controls */
        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 2px 5px rgba(46, 204, 113, 0.3);
        }

        .mode-btn.inactive {
            background-color: var(--disabled-bg);
            color: var(--disabled-text);
            opacity: 0.6;
            cursor: pointer;
        }

        .mode-btn.inactive:hover {
            opacity: 0.8;
        }

        /* Input Rows Styling */
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .input-group label {
            flex: 1;
            font-size: 0.95rem;
        }

        .rate-hint {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-left: 5px;
        }

        .input-group input {
            width: 100px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            text-align: right;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        /* Hidden utility */
        .hidden {
            display: none;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 25px 0;
        }

        /* Total Section Styling */
        .total-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .total-title {
            font-size: 1.2rem;
        }

        .total-amount {
            font-size: 1.6rem;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1>Weekly Pay Calculator</h1>

        <!-- Mode Buttons -->
        <div class="mode-buttons">
            <button id="btn-everyday" class="mode-btn active" onclick="setMode('everyday')">Everyday</button>
            <button id="btn-supervisor" class="mode-btn inactive" onclick="setMode('supervisor')">Supervisor</button>
        </div>

        <!-- Everyday Mode Inputs -->
        <div id="everyday-inputs">
            <div class="input-group">
                <label>Base <span class="rate-hint" id="rate-e-base"></span></label>
                <input type="number" step="any" min="0" class="hours-input" data-rate="base" oninput="calculateTotal()" placeholder="0">
            </div>
            <div class="input-group">
                <label>Saturday <span class="rate-hint" id="rate-e-sat"></span></label>
                <input type="number" step="any" min="0" class="hours-input" data-rate="saturday" oninput="calculateTotal()" placeholder="0">
            </div>
            <div class="input-group">
                <label>Sunday <span class="rate-hint" id="rate-e-sun"></span></label>
                <input type="number" step="any" min="0" class="hours-input" data-rate="sunday" oninput="calculateTotal()" placeholder="0">
            </div>
            <div class="input-group">
                <label>Sunday Overtime <span class="rate-hint" id="rate-e-sunOt"></span></label>
                <input type="number" step="any" min="0" class="hours-input" data-rate="sundayOvertime" oninput="calculateTotal()" placeholder="0">
            </div>
            <div class="input-group">
                <label>Public Holiday <span class="rate-hint" id="rate-e-ph"></span></label>
                <input type="number" step="any" min="0" class="hours-input" data-rate="publicHoliday" oninput="calculateTotal()" placeholder="0">
            </div>
        </div>

        <!-- Supervisor Mode Inputs -->
        <div id="supervisor-inputs" class="hidden">
            <div class="input-group">
                <label>Base <span class="rate-hint" id="rate-s-base"></span></label>
                <input type="number" step="any" min="0" class="hours-input" data-rate="base" oninput="calculateTotal()" placeholder="0">
            </div>
            <div class="input-group">
                <label>Saturday <span class="rate-hint" id="rate-s-sat"></span></label>
                <input type="number" step="any" min="0" class="hours-input" data-rate="saturday" oninput="calculateTotal()" placeholder="0">
            </div>
            <div class="input-group">
                <label>Sunday <span class="rate-hint" id="rate-s-sun"></span></label>
                <input type="number" step="any" min="0" class="hours-input" data-rate="sunday" oninput="calculateTotal()" placeholder="0">
            </div>
            <div class="input-group">
                <label>Sunday Overtime <span class="rate-hint" id="rate-s-sunOt"></span></label>
                <input type="number" step="any" min="0" class="hours-input" data-rate="sundayOvertime" oninput="calculateTotal()" placeholder="0">
            </div>
            <div class="input-group">
                <label>Public Holiday <span class="rate-hint" id="rate-s-ph"></span></label>
                <input type="number" step="any" min="0" class="hours-input" data-rate="publicHoliday" oninput="calculateTotal()" placeholder="0">
            </div>
        </div>

        <hr>

        <!-- Total Display -->
        <div class="total-container">
            <span class="total-title">Estimated Gross Pay:</span>
            <span class="total-amount" id="total-display">$0.00</span>
        </div>
    </div>

    <script>
        // EDIT YOUR HOURLY RATES HERE
        const rates = {
            everyday: {
                base: 30.00,
                saturday: 45.00,
                sunday: 60.00,
                sundayOvertime: 75.00,
                publicHoliday: 75.00
            },
            supervisor: {
                base: 40.00,
                saturday: 60.00,
                sunday: 80.00,
                sundayOvertime: 100.00,
                publicHoliday: 100.00
            }
        };

        // Track the currently active mode ('everyday' or 'supervisor')
        let currentMode = 'everyday';

        // Display current rates in parentheses next to labels
        document.getElementById('rate-e-base').innerText = `($${rates.everyday.base}/h)`;
        document.getElementById('rate-e-sat').innerText = `($${rates.everyday.saturday}/h)`;
        document.getElementById('rate-e-sun').innerText = `($${rates.everyday.sunday}/h)`;
        document.getElementById('rate-e-sunOt').innerText = `($${rates.everyday.sundayOvertime}/h)`;
        document.getElementById('rate-e-ph').innerText = `($${rates.everyday.publicHoliday}/h)`;

        document.getElementById('rate-s-base').innerText = `($${rates.supervisor.base}/h)`;
        document.getElementById('rate-s-sat').innerText = `($${rates.supervisor.saturday}/h)`;
        document.getElementById('rate-s-sun').innerText = `($${rates.supervisor.sunday}/h)`;
        document.getElementById('rate-s-sunOt').innerText = `($${rates.supervisor.sundayOvertime}/h)`;
        document.getElementById('rate-s-ph').innerText = `($${rates.supervisor.publicHoliday}/h)`;

        function setMode(mode) {
            currentMode = mode;
            
            const btnEveryday = document.getElementById('btn-everyday');
            const btnSupervisor = document.getElementById('btn-supervisor');
            const everydayDiv = document.getElementById('everyday-inputs');
            const supervisorDiv = document.getElementById('supervisor-inputs');

            if (mode === 'everyday') {
                btnEveryday.className = "mode-btn active";
                btnSupervisor.className = "mode-btn inactive";
                everydayDiv.classList.remove('hidden');
                supervisorDiv.classList.add('hidden');
            } else {
                btnEveryday.className = "mode-btn inactive";
                btnSupervisor.className = "mode-btn active";
                everydayDiv.classList.add('hidden');
                supervisorDiv.classList.remove('hidden');
            }
            
            // Recalculate instantly when switching modes
