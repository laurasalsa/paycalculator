<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly Pay Calculator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
    }

    .mode-buttons {
        text-align: center;
        margin-bottom: 20px;
    }

    button {
        padding: 10px 20px;
        margin: 5px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
    }

    .active {
        background-color: #4CAF50;
        color: white;
    }

    .inactive {
        background-color: #ccc;
        color: #333;
    }

    .container {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .row {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
    }

    input {
        width: 80px;
        padding: 5px;
        font-size: 16px;
    }

    #total {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>
<body>

<h1>Weekly Pay Calculator</h1>

<div class="mode-buttons">
    <button id="everydayBtn" class="active">Everyday Mode</button>
    <button id="supervisorBtn" class="inactive">Supervisor Mode</button>
</div>

<div class="container" id="inputsContainer">
    <!-- Inputs will be injected here -->
</div>

<div id="total">Total: $0.00</div>

<script>
    // Pay rates for each mode
    const rates = {
        everyday: {
            base: 30,
            saturday: 35,
            sunday: 40,
            sunday_ot: 50,
            public_holiday: 60
        },
        supervisor: {
            base: 40,
            saturday: 45,
            sunday: 55,
            sunday_ot: 65,
            public_holiday: 75
        }
    };

    let currentMode = "everyday";

    const categories = [
        { key: "base", label: "Base" },
        { key: "saturday", label: "Saturday" },
        { key: "sunday", label: "Sunday" },
        { key: "sunday_ot", label: "Sunday Overtime" },
        { key: "public_holiday", label: "Public Holiday" }
    ];

    const container = document.getElementById("inputsContainer");

    function renderInputs() {
        container.innerHTML = "";
        categories.forEach(cat => {
            const row = document.createElement("div");
            row.className = "row";

            row.innerHTML = `
                <span>${cat.label} ($${rates[currentMode][cat.key]}/hr)</span>
                <input type="number" min="0" step="0.1" data-key="${cat.key}">
            `;
            container.appendChild(row);
        });

        container.querySelectorAll("input").forEach(input => {
            input.addEventListener("input", calculateTotal);
        });
    }

    function calculateTotal() {
        let total = 0;
        container.querySelectorAll("input").forEach(input => {
            const hours = parseFloat(input.value) || 0;
            const key = input.dataset.key;
            total += hours * rates[currentMode][key];
        });

        document.getElementById("total").textContent = 
            `Total: $${total.toFixed(2)}`;
    }

    // Mode switching
    document.getElementById("everydayBtn").onclick = () => {
        currentMode = "everyday";
        updateButtons();
        renderInputs();
        calculateTotal();
    };

    document.getElementById("supervisorBtn").onclick = () => {
        currentMode = "supervisor";
        updateButtons();
        renderInputs();
        calculateTotal();
    };

    function updateButtons() {
        const everydayBtn = document.getElementById("everydayBtn");
        const supervisorBtn = document.getElementById("supervisorBtn");

        if (currentMode === "everyday") {
            everydayBtn.classList.add("active");
            everydayBtn.classList.remove("inactive");
            supervisorBtn.classList.add("inactive");
            supervisorBtn.classList.remove("active");
        } else {
            supervisorBtn.classList.add("active");
            supervisorBtn.classList.remove("inactive");
            everydayBtn.classList.add("inactive");
            everydayBtn.classList.remove("active");
        }
    }

    // Initial render
    renderInputs();
</script>

</body>
</html>
